<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотогалерея</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1 class="title">Фотогалерея</h1>

    <p class="message" id="message" role="status"></p>

    <ul class="gallery" id="gallery"></ul>

    <div class="controls">
      <button type="button" class="btn" id="load-more">Завантажити ще 4 картинки</button>
      <button type="button" class="btn" id="clear">Очистити галерею</button>
      <button type="button" class="btn" id="remove-last">Видалити останню картинку</button>
      <button type="button" class="btn" id="reverse">Перевернути галерею</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
